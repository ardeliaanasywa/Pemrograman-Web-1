<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family: Georgia, serif;
    background:white;
}

.contact{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.corner{
    position:fixed;
    width:40px;
    height:40px;
    border:5px solid #222;
}

.tl{
    top:30px;
    left:30px;
    border-right:none;
    border-bottom:none;
}

.tr{
    top:30px;
    right:30px;
    border-left:none;
    border-bottom:none;
}

.bl{
    bottom:30px;
    left:30px;
    border-right:none;
    border-top:none;
}

.br{
    bottom:30px;
    right:30px;
    border-left:none;
    border-top:none;
}

.contact-info{
    margin-top:50px;
}

.contact-info p{
    color:#777;
    margin-bottom:25px;
}
</style>
</head>

<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<section class="contact">

    <div class="container">

        <h1 class="display-4 fw-bold">
            Contact
        </h1>

        <h4 class="mt-3">
            Let's Connect.
        </h4>

        <p class="text-muted mx-auto mt-4" style="max-width:700px;">
            Whether you have a project in mind, a collaboration opportunity,
            or simply want to say hello, feel free to reach out.
        </p>

        <hr class="w-25 mx-auto my-5">

        <div class="contact-info">

            <p>
                ardeliaanasywa@gmail.com
            </p>

            <p>
                +62 812 4764 5741
            </p>

            <p>
                Jakarta, Indonesia
            </p>

        </div>

    </div>

</section>

</body>
</html>
