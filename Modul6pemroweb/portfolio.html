<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Portfolio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family: Georgia, serif;
    background:white;
}

.portfolio{
    max-width:1200px;
    margin:auto;
    padding:80px 30px;
}

.portfolio img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.category{
    margin-top:80px;
    margin-bottom:30px;
}

.corner{
    position:fixed;
    width:40px;
    height:40px;
    border:5px solid #222;
}

.tl{
    top:30px;
    left:30px;
    border-right:none;
    border-bottom:none;
}

.tr{
    top:30px;
    right:30px;
    border-left:none;
    border-bottom:none;
}

.bl{
    bottom:30px;
    left:30px;
    border-right:none;
    border-top:none;
}

.br{
    bottom:30px;
    right:30px;
    border-left:none;
    border-top:none;
}
</style>
</head>

<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<section class="portfolio text-center">

    <h1 class="display-4 fw-bold">
        My Portfolio
    </h1>

    <h4 class="mt-3">
        A Collection Of Stories Captured Through My Lens.
    </h4>

    <p class="text-muted mx-auto mt-4" style="max-width:700px;">
        Every photograph tells a unique story. Here are some selected works
        that reflect my passion for travel, portrait, and commercial photography.
    </p>

    <hr class="w-25 mx-auto my-5">

    <!-- Travel -->
    <h2 class="category">Travel</h2>

    <div class="row justify-content-center g-4">

        <div class="col-4">
            <img src="image\image copy 1.png" class="rounded">
        </div>

        <div class="col-4">
            <img src="image\image copy 2.png" class="rounded">
        </div>

        <div class="col-4">
            <img src="image\image copy 3.png" class="rounded">
        </div>

    </div>

    <!-- Portrait -->
    <h2 class="category">Portrait</h2>

    <div class="row justify-content-center g-4">

        <div class="col-4">
            <img src="image\image copy 4.png" class="rounded">
        </div>

        <div class="col-4">
            <img src="image\image copy 5.png" class="rounded">
        </div>

        <div class="col-4">
            <img src="image\image copy 6.png" class="rounded">
        </div>

    </div>

    <!-- Commercial -->
    <h2 class="category">Commercial</h2>

    <div class="row justify-content-center g-4">

        <div class="col-4">
            <img src="image\image copy 7.png" class="rounded">
        </div>

        <div class="col-4">
            <img src="image\image copy 8.png" class="rounded">
        </div>

        <div class="col-4">
            <img src="image\image copy 9.png" class="rounded">
        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
